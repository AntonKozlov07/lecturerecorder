[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lecturerecorder"
version = "0.2.1"
description = "Record lectures, transcribe them on your PC, and study them with Claude: notes, chat, deep dives, quizzes and flashcards."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.8",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.1",
    "pypdf>=4.0",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "cryptography>=42",
    "qrcode>=7.4",
]

[project.scripts]
lecturerecorder = "lecturerecorder.__main__:main"

[tool.setuptools]
packages = ["lecturerecorder"]

[tool.setuptools.package-data]
lecturerecorder = ["static/*", "static/icons/*", "static/vendor/*", "static/vendor/katex/*", "static/vendor/katex/fonts/*"]
